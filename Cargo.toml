[package]
name = "localgateway-api"
version = "0.3.0"
authors = ["OpenAPI Generator team and contributors"]
description = "LocalGateway 本地服务发现与反向代理的管理面。所有写操作需要 POST /gw/session 获得的 bearer token。"
license = "MIT"
edition = "2021"

[dependencies]
serde = { version = "^1.0", features = ["derive"] }
serde_with = { version = "^3.8", default-features = false, features = ["base64", "std", "macros"] }
serde_json = "^1.0"
serde_repr = "^0.1"
url = "^2.5"
reqwest = { version = "^0.13", default-features = false, features = ["json", "multipart", "query", "form"] }

[features]
default = []
native-tls = ["reqwest/native-tls"]
rustls = ["reqwest/rustls"]

# openapi-generator output is not written to satisfy every Clippy style lint.
# Keep the generated crate in the crate lint gate without hand-editing the
# generated sources; generate.ps1 appends the same block after each run.
[lints.clippy]
needless_return = "allow"
derivable_impls = "allow"
